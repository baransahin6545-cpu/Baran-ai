<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baran AI</title>
<style>
body {
  margin: 0;
  background: #050910;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding-top: 50px;
}

h1 {
  letter-spacing: 5px;
}

#orb {
  width: 150px;
  height: 150px;
  margin: 40px auto;
  border: 2px solid #50d8ff;
  border-radius: 50%;
  box-shadow: 0 0 35px #1686b8;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 50px;
}

button {
  padding: 15px 25px;
  border: 0;
  border-radius: 12px;
  font-size: 17px;
  margin: 5px;
}

#status {
  margin: 25px;
  color: #8fe8ff;
}
</style>
</head>

<body>

<h1>BARAN AI</h1>
<p>JARVIS prototipi v1</p>

<div id="orb">◉</div>

<button onclick="startListening()">🎙️ Dinle</button>

<div id="status">Hazır.</div>

<script>
const status = document.getElementById("status");

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

function startListening() {

  if (!SpeechRecognition) {
    status.innerText =
      "Bu tarayıcı ses tanımayı desteklemiyor.";
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "tr-TR";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = function() {
    status.innerText = "🎙️ Dinliyorum...";
  };

  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript;

    status.innerText =
      "Sen: " + text;

    speak("Seni duydum Baran.");
  };

  recognition.onerror = function(event) {
    status.innerText =
      "Hata: " + event.error;
  };

  recognition.start();
}

function speak(text) {

  const voice =
    new SpeechSynthesisUtterance(text);

  voice.lang = "tr-TR";

  speechSynthesis.speak(voice);
}
</script>

</body>
</html>
