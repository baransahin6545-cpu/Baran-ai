<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BARAN AI</title>

<style>
body{
    margin:0;
    background:#050b14;
    color:#00eaff;
    font-family:Arial,sans-serif;
    text-align:center;
}

.container{
    padding:35px 20px;
}

h1{
    font-size:42px;
    letter-spacing:5px;
    text-shadow:0 0 20px #00eaff;
}

#orb{
    width:180px;
    height:180px;
    margin:45px auto 30px;
    border:3px solid #00eaff;
    border-radius:50%;
    box-shadow:0 0 25px #00eaff,0 0 70px #0066ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:70px;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    50%{
        transform:scale(1.08);
        box-shadow:0 0 50px #00eaff,0 0 100px #0066ff;
    }
}

button{
    background:#061522;
    color:#00eaff;
    border:2px solid #00eaff;
    border-radius:12px;
    padding:15px 30px;
    font-size:20px;
    box-shadow:0 0 15px #00eaff;
}

button:active{
    transform:scale(.95);
}

#durum{
    margin-top:25px;
    font-size:18px;
}

#cevap{
    margin:30px auto;
    max-width:600px;
    min-height:50px;
    padding:20px;
    border:1px solid #075d78;
    border-radius:15px;
    background:#07121e;
    color:white;
}
</style>
</head>

<body>

<div class="container">

<h1>BARAN AI</h1>

<div id="orb">◉</div>

<button onclick="dinle()">🎙️ DİNLE</button>

<div id="durum">Hazır...</div>

<div id="cevap">
Merhaba Baran. Ben hazırım.
</div>

</div>

<script>
function konus(metin){
    document.getElementById("cevap").innerText=metin;

    if("speechSynthesis" in window){
        let ses=new SpeechSynthesisUtterance(metin);
        ses.lang="tr-TR";
        ses.rate=1;
        speechSynthesis.speak(ses);
    }
}

function dinle(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){
        konus("Tarayıcınız sesli komutu desteklemiyor.");
        return;
    }

    let recognition=new SpeechRecognition();

    recognition.lang="tr-TR";
    recognition.continuous=false;
    recognition.interimResults=false;

    document.getElementById("durum").innerText="Dinliyorum...";

    recognition.start();

    recognition.onresult=function(event){

        let komut=event.results[0][0].transcript.toLowerCase();

        document.getElementById("durum").innerText=
            "Sen: "+komut;

        if(komut.includes("merhaba")){
            konus("Merhaba. Size nasıl yardımcı olabilirim?");
        }

        else if(komut.includes("nasılsın")){
            konus("Teşekkür ederim. Sistemlerim hazır.");
        }

        else if(komut.includes("saat")){
            let saat=new Date().toLocaleTimeString("tr-TR");
            konus("Şu an saat "+saat);
        }

        else{
            konus("Komutunuzu duydum: "+komut);
        }
    };

    recognition.onerror=function(){
        document.getElementById("durum").innerText=
            "Ses alınamadı. Tekrar deneyin.";
    };

    recognition.onend=function(){
        document.getElementById("durum").innerText="Hazır...";
    };
}
</script>

</body>
</html>
