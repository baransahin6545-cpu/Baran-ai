<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BARAN AI</title>

<style>
*{box-sizing:border-box}
body{
margin:0;background:#020711;color:#dffcff;
font-family:Arial,sans-serif;min-height:100vh;
}
header{
height:65px;padding:0 18px;display:flex;
align-items:center;justify-content:space-between;
border-bottom:1px solid #00eaff44;
background:#020914;
}
.logo{font-weight:bold;letter-spacing:4px;color:#00eaff}
.status{font-size:12px;color:#64efff}
main{
max-width:760px;margin:auto;padding:20px;
text-align:center;
}
.orb{
width:190px;height:190px;margin:35px auto;
border-radius:50%;
border:2px solid #00eaff;
box-shadow:0 0 30px #00eaff,0 0 90px #0066ff88;
display:grid;place-items:center;
animation:pulse 2s infinite;
}
.orb span{
width:70px;height:70px;border-radius:50%;
background:#00eaff;
box-shadow:0 0 35px #00eaff;
}
@keyframes pulse{
50%{transform:scale(1.06);box-shadow:0 0 55px #00eaff,0 0 120px #0066ff}
}
h1{letter-spacing:5px}
#durum{color:#75edff;margin:15px}
#cevap{
min-height:80px;padding:18px;margin:20px 0;
border:1px solid #00eaff33;border-radius:15px;
background:#06111e;color:#fff;line-height:1.5;
}
.controls{display:flex;gap:8px}
input{
flex:1;padding:15px;border-radius:12px;
border:1px solid #00eaff55;background:#071523;
color:#fff;font-size:16px;outline:none;
}
button{
padding:14px 18px;border-radius:12px;
border:1px solid #00eaff88;
background:#062335;color:#9ff7ff;
font-size:18px;
}
#log{
margin-top:18px;text-align:left;
font-size:13px;color:#78aebc;
max-height:130px;overflow:auto;
}
</style>
</head>

<body>

<header>
<div class="logo">BARAN AI</div>
<div class="status" id="status">● ONLINE</div>
</header>

<main>

<div class="orb"><span></span></div>

<h1>MERHABA BARAN</h1>

<div id="durum">Sistemler hazır.</div>

<div id="cevap">
Merhaba Baran. Seni dinlemeye hazırım.
</div>

<div class="controls">
<input id="input" placeholder="Komutunu yaz...">
<button onclick="gonder()">➤</button>
<button onclick="dinle()">🎙</button>
</div>

<div id="log"></div>

</main>

<script>

const input=document.getElementById("input");
const cevap=document.getElementById("cevap");
const durum=document.getElementById("durum");
const status=document.getElementById("status");
const log=document.getElementById("log");


function yaz(metin){

cevap.innerText=metin;

log.innerHTML=
"<div>› "+metin+"</div>"+log.innerHTML;

}


function konus(metin){

yaz(metin);

if("speechSynthesis" in window){

speechSynthesis.cancel();

const ses=new SpeechSynthesisUtterance(metin);

ses.lang="tr-TR";
ses.rate=.95;
ses.pitch=1;

speechSynthesis.speak(ses);

}

}


function gonder(){

let komut=input.value.trim();

if(!komut)return;

input.value="";

komutCalistir(komut);

}


input.addEventListener("keydown",function(e){

if(e.key==="Enter")gonder();

});


function komutCalistir(komut){

let k=komut.toLowerCase().trim();


if(k.includes("merhaba")||k.includes("selam")){

konus("Merhaba Baran. Sistemlerim tamamen hazır.");

return;

}


if(k.includes("nasılsın")||k.includes("nasilsin")){

konus("Teşekkür ederim Baran. Sistemlerim çalışıyor.");

return;

}


if(k.includes("saat")){

let saat=new Date().toLocaleTimeString(
"tr-TR",
{hour:"2-digit",minute:"2-digit"}
);

konus("Şu an saat "+saat);

return;

}


if(k.includes("tarih")||
k.includes("bugün günlerden ne")||
k.includes("bugun gunlerden ne")){

let tarih=new Date().toLocaleDateString(
"tr-TR",
{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}
);

konus("Bugün "+tarih);

return;

}


if(k.includes("youtube")){

konus("YouTube'u açıyorum.");

setTimeout(()=>{

window.open(
"https://www.youtube.com",
"_blank"
);

},600);

return;

}


if(k.includes("google")){

let arama=k
.replace("google'da","")
.replace("googleda","")
.replace("google","")
.replace("ara","")
.trim();

if(!arama){

konus("Google'da ne aramamı istediğini söyle.");

return;

}

konus(arama+" için Google'da arama yapıyorum.");

setTimeout(()=>{

window.open(
"https://www.google.com/search?q="+
encodeURIComponent(arama),
"_blank"
);

},600);

return;

}


if(k.includes("harita")||
k.includes("konum")){

konus("Haritaları açıyorum.");

setTimeout(()=>{

window.open(
"https://www.google.com/maps",
"_blank"
);

},600);

return;

}


if(k.includes("hesapla")||
k.includes("kaç eder")||
k.includes("kac eder")){

let ifade=k
.replace("hesapla","")
.replace("kaç eder","")
.replace("kac eder","")
.replace(/artı/g,"+")
.replace(/arti/g,"+")
.replace(/eksi/g,"-")
.replace(/çarpı/g,"*")
.replace(/carpi/g,"*")
.replace(/bölü/g,"/")
.replace(/bolu/g,"/")
.trim();

if(/^[0-9+\-*/().\s]+$/.test(ifade)){

try{

let sonuc=Function(
'"use strict";return ('+ifade+')'
)();

konus("Sonuç "+sonuc);

}catch{

konus("Bu işlemi hesaplayamadım.");

}

}else{

konus("Örneğin 25 artı 15 kaç eder diyebilirsin.");

}

return;

}


if(k.includes("yardım")||k.includes("yardim")){

konus(
"Şunları deneyebilirsin: saat kaç, bugün günlerden ne, " +
"YouTube aç, Google'da ara, harita aç veya hesaplama yap."
);

return;

}


if(k.includes("yenile")){

konus("Sayfayı yeniliyorum.");

setTimeout(()=>location.reload(),900);

return;

}


konus(
"Komutunu aldım: "+komut+
". Bu komut için henüz özel bir işlem tanımlı değil."
);

}


function dinle(){

const SR=
window.SpeechRecognition||
window.webkitSpeechRecognition;


if(!SR){

konus("Bu tarayıcı sesli komutu desteklemiyor.");

return;

}


const r=new SR();

r.lang="tr-TR";
r.continuous=false;
r.interimResults=false;


r.onstart=function(){

durum.innerText="🎙 Dinliyorum...";
status.innerText="● DİNLİYOR";

};


r.onresult=function(event){

const metin=
event.results[0][0].transcript;

durum.innerText="Komut alındı.";

komutCalistir(metin);

};


r.onerror=function(){

durum.innerText="Ses algılanamadı.";
status.innerText="● ONLINE";

};


r.onend=function(){

status.innerText="● ONLINE";

setTimeout(()=>{

durum.innerText="Sistemler hazır.";

},500);

};


r.start();

}

</script>

</body>
</html>
